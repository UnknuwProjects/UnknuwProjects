  <rect x="230" y="596" width="3.0" height="13" rx="6.5" fill="#f4d36b"/>
  <text x="680" y="608" class="white" text-anchor="end">0.53%</text>

  <text x="84" y="651" class="white">C</text>
  <rect x="230" y="635" width="430" height="13" rx="6.5" fill="#2b3b50"/>
