name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 07:00 Jakarta time
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/generate_metrics.py"

permissions:
  contents: write

# One run at a time. Two runs that push the updated card at the
# same moment would reject each other's push.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check token
        id: token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "METRICS_TOKEN is not set. Skipping this run: without"
            echo "it, only public repos are counted and the card would"
            echo "go back to the old, lower numbers."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate metrics card
        if: steps.token.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          METRICS_USER: UnknuwProjects
        run: python scripts/generate_metrics.py

      - name: Commit updated metrics
        if: steps.token.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics.svg

          if git diff --cached --quiet; then
            echo "metrics.svg is already up to date."
            exit 0
          fi

          git commit -m "chore: update GitHub metrics [skip ci]"
          git push
