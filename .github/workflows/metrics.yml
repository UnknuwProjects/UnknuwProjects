name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 07:00 Jakarta time
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/generate_metrics.py"

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Generate custom live metrics dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          METRICS_USER: UnknuwProjects
        run: python scripts/generate_metrics.py
      - name: Commit updated metrics
        run: |
          if git diff --quiet -- metrics.svg; then
            echo "metrics.svg is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          git commit -m "chore: update GitHub metrics [skip ci]"
          git push
