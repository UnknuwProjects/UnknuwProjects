name: GitHub Metrics

on:
  # Refresh metrics every day at 00:00 UTC (07:00 Jakarta time)
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

  # Refresh after changes are pushed to the default branches
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UnknuwProjects

          # Clean, modern layout instead of the terminal-style output
          template: classic
          filename: metrics.svg

          # Main profile information
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # Display and rendering
          config_timezone: Asia/Surabaya
          config_display: large
          config_output: svg
          config_animations: no

          # Keep the generated sections in a deliberate order
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata, isocalendar, languages, calendar, stars

          # Programming languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # Full-year contribution overview
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Full contribution history
          plugin_calendar: yes
          plugin_calendar_limit: 0

          # Recently starred repositories
          plugin_stars: yes

          # Reliability
          retries: 3
          output_action: commit
