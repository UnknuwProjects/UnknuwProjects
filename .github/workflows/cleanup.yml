name: Clean old workflow runs

on:
  schedule:
    - cron: "30 22 * * 0" # Mondays 05:30 Jakarta time (Sunday 22:30 UTC)
  workflow_dispatch:

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting completed runs created before $cutoff"
          ids=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --paginate --jq ".workflow_runs[] | select(.status == \"completed\" and .created_at < \"$cutoff\") | .id")
          count=0
          for id in $ids; do
            if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" --silent; then
              count=$((count + 1))
            fi
          done
          echo "Deleted $count run(s)."
